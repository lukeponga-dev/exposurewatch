<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        const boundFetch = window.fetch ? window.fetch.bind(window) : globalThis.fetch;
        try { delete window.fetch; } catch (err) {}
        Object.defineProperty(window, 'fetch', {
          value: boundFetch,
          writable: true,
          configurable: true,
          enumerable: true
        });
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

server:
  port: ${PORT:8080}

spring:
  application:
    name: exposurewatch-api

exposurewatch:
  xposedornot:
    base-url: ${XPOSEDORNOT_BASE_URL:https://api.xposedornot.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
